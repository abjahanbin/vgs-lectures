<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Game Studies — Lectures</title>
    <link rel="stylesheet" href="./shared/theme.css" />
    <style>
      .landing {
        max-width: 40rem;
        margin: 0 auto;
        padding: 4rem 1.5rem 6rem;
      }
      .landing h1 {
        font-family: 'Russo One', sans-serif;
        font-size: 2rem;
        margin: 0 0 0.3em;
      }
      .landing p {
        font-family: 'Rajdhani', sans-serif;
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 2rem;
      }
      .landing-weeks {
        list-style: none;
        margin: 2rem 0 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 0.75rem;
      }
      .landing-weeks a,
      .landing-weeks .disabled {
        display: flex;
        align-items: center;
        justify-content: center;
        aspect-ratio: 1;
        border: 1px solid var(--accent-neutral);
        color: var(--fg-color);
        text-decoration: none;
        font-family: 'Russo One', sans-serif;
        font-size: 1.25rem;
        font-weight: 700;
        transition: border-color 0.15s ease, color 0.15s ease;
      }
      .landing-weeks a:hover,
      .landing-weeks a:focus-visible {
        border-color: var(--accent-cyan);
        color: var(--accent-cyan);
      }
      .landing-weeks .disabled {
        border-color: rgba(124, 135, 152, 0.35);
        color: rgba(124, 135, 152, 0.5);
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <main class="landing">
      <h1 class="title-highlight" style="--divider-color: var(--accent-cyan);">
        Video Game Studies
      </h1>
      <p class="text-neutral">Weekly slides</p>
      <ol class="landing-weeks">
        <li><a href="./week01/index.html">01</a></li>
        <li><a href="./week02/index.html">02</a></li>
        <li><a href="./week03/index.html">03</a></li>
        <li><a href="./week04/index.html">04</a></li>
        <li><span class="disabled" aria-disabled="true">05</span></li>
        <li><span class="disabled" aria-disabled="true">06</span></li>
        <li><span class="disabled" aria-disabled="true">07</span></li>
        <li><a href="./week08/index.html">08</a></li>
        <li><span class="disabled" aria-disabled="true">09</span></li>
        <li><span class="disabled" aria-disabled="true">10</span></li>
        <li><span class="disabled" aria-disabled="true">11</span></li>
        <li><span class="disabled" aria-disabled="true">12</span></li>
        <li><span class="disabled" aria-disabled="true">13</span></li>
        <li><span class="disabled" aria-disabled="true">14</span></li>
        <li><span class="disabled" aria-disabled="true">15</span></li>
      </ol>
    </main>
  </body>
</html>
